{% extends "base.html" %}
{% set no_search = true %}
{% block title %}Belépés{% endblock %}
{% block content %}
<h1>Belépés – {{ feed.name }}</h1>
<p class="muted">A könyvtár jelszót kér. Egyszer kell megadnod, a Polc megjegyzi ezen az eszközön.</p>
{% if error %}<div class="box"><b>{{ error }}</b></div>{% endif %}
<form method="post" action="/belepes/{{ feed.id }}">
  <input type="hidden" name="vissza" value="{{ vissza }}">
  <label for="u">Felhasználónév</label>
  <input class="mezo" id="u" type="text" name="felhasznalo" autocapitalize="off" autocorrect="off" autocomplete="username">
  <label for="j">Jelszó</label>
  <input class="mezo" id="j" type="password" name="jelszo" autocomplete="current-password">
  <p><button class="btn fo" type="submit">Belépés</button></p>
</form>
{% endblock %}
