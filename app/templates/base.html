<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ heading or title }}{% endblock %} – {{ title }}</title>
<style>
/* E-ink barát: fekete-fehér, nincs flexbox, nincs animáció, nagy érintési felületek */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; color: #000; }
body { font-family: Georgia, "Times New Roman", serif; font-size: 20px; line-height: 1.35; }
a { color: #000; }
.wrap { padding: 10px 14px 30px 14px; }
.top { border-bottom: 3px solid #000; padding: 8px 14px; }
.top table { width: 100%; border-collapse: collapse; }
.top td { vertical-align: middle; }
.brand { font-size: 26px; font-weight: bold; text-decoration: none; letter-spacing: 1px; }
.toplinks { text-align: right; white-space: nowrap; }
.toplinks a { display: inline-block; padding: 8px 10px; font-size: 18px; text-decoration: none; border: 2px solid #000; margin-left: 6px; }
.search { margin: 12px 0 6px 0; }
.search table { width: 100%; border-collapse: collapse; }
.search input[type=text] { width: 100%; font-size: 22px; padding: 10px; border: 2px solid #000; border-radius: 0; font-family: inherit; }
.search button { font-size: 20px; padding: 10px 14px; border: 2px solid #000; background: #000; color: #fff; font-family: inherit; }
h1 { font-size: 26px; margin: 14px 0 6px 0; }
h2 { font-size: 22px; margin: 18px 0 6px 0; }
.crumb { font-size: 17px; margin: 4px 0 10px 0; }
.crumb a { text-decoration: none; border-bottom: 1px solid #000; }
.muted { color: #333; font-size: 17px; }
.small { font-size: 16px; }
.btn { display: inline-block; padding: 12px 16px; margin: 4px 6px 4px 0; border: 2px solid #000; text-decoration: none; font-size: 19px; background: #fff; color: #000; font-family: inherit; cursor: pointer; }
.btn.fo { background: #000; color: #fff; font-weight: bold; }
.btn.kicsi { padding: 7px 10px; font-size: 16px; }
.views { margin: 6px 0 12px 0; font-size: 17px; }
.views a, .views b { display: inline-block; padding: 6px 10px; border: 2px solid #000; margin-right: 4px; text-decoration: none; }
.views b { background: #000; color: #fff; }
/* navigációs csempék */
.tiles { font-size: 0; }
.tile { display: inline-block; width: 48%; margin: 0 2% 10px 0; vertical-align: top; font-size: 21px; border: 2px solid #000; padding: 14px 12px; text-decoration: none; min-height: 72px; }
.tile:nth-child(2n) { margin-right: 0; }
.tile .db { display: block; font-size: 15px; color: #333; margin-top: 4px; }
.navlist a { display: block; padding: 13px 4px; border-bottom: 1px solid #000; text-decoration: none; font-size: 21px; }
.navlist .db { float: right; font-size: 16px; color: #333; }
/* lista nézet */
table.books { width: 100%; border-collapse: collapse; }
table.books td { border-bottom: 1px solid #000; padding: 10px 6px; vertical-align: top; }
table.books td.c { width: 84px; }
table.books img { width: 76px; border: 1px solid #000; display: block; }
.bt { font-size: 21px; font-weight: bold; text-decoration: none; display: block; }
.ba { font-size: 18px; margin-top: 2px; }
.fmt { display: inline-block; font-size: 13px; border: 1px solid #000; padding: 1px 5px; margin: 4px 4px 0 0; font-family: Arial, sans-serif; }
/* rács nézet */
.grid { font-size: 0; }
.cell { display: inline-block; width: 32%; margin: 0 2% 14px 0; vertical-align: top; font-size: 16px; text-decoration: none; }
.cell:nth-child(3n) { margin-right: 0; }
.cell img, .cell .noimg { width: 100%; border: 1px solid #000; display: block; }
.noimg { height: 0; padding-bottom: 145%; position: relative; background: #fff; }
.noimg span { position: absolute; top: 10px; left: 8px; right: 8px; font-size: 16px; }
.cell .ct { display: block; margin-top: 4px; font-weight: bold; line-height: 1.2; max-height: 3.6em; overflow: hidden; }
.cell .ca { display: block; color: #333; font-size: 14px; max-height: 1.3em; overflow: hidden; }
/* tömör nézet */
ol.compact { padding-left: 34px; margin: 0; }
ol.compact li { padding: 8px 0; border-bottom: 1px solid #000; font-size: 19px; }
ol.compact a { text-decoration: none; font-weight: bold; }
/* könyv adatlap */
table.detail { width: 100%; border-collapse: collapse; }
table.detail td { vertical-align: top; }
table.detail td.c { width: 40%; padding-right: 14px; }
table.detail img { width: 100%; border: 1px solid #000; }
.meta { font-size: 17px; margin: 8px 0; }
.meta td { padding: 3px 10px 3px 0; vertical-align: top; }
.desc { font-size: 19px; margin-top: 14px; }
.actions { margin: 14px 0; }
.box { border: 3px solid #000; padding: 12px; margin: 12px 0; }
.pager { margin: 18px 0; text-align: center; }
.pager .btn { min-width: 40%; text-align: center; }
form.inline { display: inline; margin: 0; }
label { display: block; margin: 12px 0 4px 0; }
input.mezo, select.mezo { width: 100%; font-size: 21px; padding: 10px; border: 2px solid #000; border-radius: 0; font-family: inherit; background: #fff; }
.foot { margin-top: 30px; border-top: 1px solid #000; padding-top: 8px; font-size: 14px; color: #333; }
</style>
</head>
<body>
<div class="top"><table><tr>
  <td><a class="brand" href="/">{{ title }}</a></td>
  <td class="toplinks">{% if feed %}<a href="{{ u_feed(feed.id, feed.root_path) }}">Főoldal</a>{% endif %}<a href="/beallitasok">Beállítások</a></td>
</tr></table></div>
<div class="wrap">
{% if feed and not no_search %}
<form class="search" action="/kereses/{{ feed.id }}" method="get"><table><tr>
  <td><input type="text" name="q" value="{{ query or '' }}" placeholder="Cím, szerző, kulcsszó…" autocomplete="off"></td>
  <td style="width:1%"><button type="submit">Keresés</button></td>
</tr></table></form>
{% endif %}
{% block content %}{% endblock %}
<div class="foot">{{ title }} {{ version }} · magyar OPDS proxy Kindle-re</div>
</div>
</body>
</html>
